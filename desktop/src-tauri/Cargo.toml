[package]
name = "playdrive-desktop"
version = "0.1.0"
description = "Playdrive Desktop runtime"
authors = ["OpenAI"]
edition = "2021"

[lib]
name = "playdrive_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.1.1", features = [] }
url = "2.5.2"

pcsc = "2.9.0"

# IKEA DIRIGERA (slimme stekkers, lokaal netwerk)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# Automatisch bijwerken (zie src/commands/updater.rs)
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
